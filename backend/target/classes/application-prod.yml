spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mplads_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: MPLADS-HikariCP-Prod
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
      leak-detection-threshold: 5000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 25
        jdbc:
          batch_size: 25
  h2:
    console:
      enabled: false

logging:
  level:
    root: INFO
    com.mplads.monitoring: INFO
